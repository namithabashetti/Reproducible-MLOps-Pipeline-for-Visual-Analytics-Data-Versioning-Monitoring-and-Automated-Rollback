global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s

scrape_configs:
  - job_name: visual-analytics-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
  - job_name: visual-analytics-evidence
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:8767]
