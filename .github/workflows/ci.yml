name: Local validation and serving

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: Local deployment after validation and Docker build
        type: choice
        options: [none, stable, experimental]
        default: none
      model_version:
        description: Explicit numeric version (required for experimental deployment)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: visual-analytics-laptop
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == true &&
      github.repository == 'varshithdoli/Reproducible-MLOps-Pipeline-for-Visual-Analytics-Data-Versioning-Monitoring-and-Automated-Rollback'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      MLFLOW_DISABLE_TELEMETRY: 'true'
      MLFLOW_DISABLE_AGENT_HINT: '1'
      DVC_NO_ANALYTICS: 'true'
      # Git needs its own long-path flag for this repository's long Windows checkout.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'

    steps:
      - name: Check runner workspace and Python
        run: |
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          if (-not $workspace.StartsWith('F:\visual-analytics-actions-runner\_work\', [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Use the dedicated runner checkout, never the development or dataset directory.'
          }
          py -3.11 -c "import sys; assert sys.version_info[:3] == (3, 11, 9), sys.version; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout the dispatched commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install locked dependencies in a temporary environment
        run: |
          py -3.11 -m venv "$env:RUNNER_TEMP\venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & "$env:RUNNER_TEMP\venv\Scripts\python.exe" -m pip install --no-input --no-compile -r requirements-lock.txt
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            [Console]::WriteLine("Dependency installation attempt $attempt failed; retrying in five seconds.")
            [Threading.Thread]::Sleep(5000)
          }
          & "$env:RUNNER_TEMP\venv\Scripts\python.exe" -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile project sources
        run: |
          & "$env:RUNNER_TEMP\venv\Scripts\python.exe" -m compileall -q src scripts tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run isolated tests
        run: |
          & "$env:RUNNER_TEMP\venv\Scripts\python.exe" -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build CPU serving image
        run: |
          & "$env:LOCALAPPDATA\Programs\DockerDesktop\resources\bin\docker.exe" build --progress plain -t "visual-analytics-api:$env:GITHUB_SHA" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy selected local registry version
        if: inputs.deployment != 'none'
        env:
          DEPLOYMENT_MODE: ${{ inputs.deployment }}
          MODEL_VERSION: ${{ inputs.model_version }}
        run: |
          $deployArgs = @('-m', 'src.serving.deploy', '--store-project', 'F:\major project implementation', '--image', "visual-analytics-api:$env:GITHUB_SHA")
          if ($env:MODEL_VERSION) { $deployArgs += @('--version', $env:MODEL_VERSION) }
          if ($env:DEPLOYMENT_MODE -eq 'experimental') { $deployArgs += '--experimental' }
          & "$env:RUNNER_TEMP\venv\Scripts\python.exe" @deployArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record validation scope
        env:
          DEPLOYMENT_MODE: ${{ inputs.deployment }}
        run: |
          @'
          import hashlib
          import os
          from pathlib import Path

          lock_hash = hashlib.sha256(Path("requirements-lock.txt").read_bytes()).hexdigest()
          summary = f"""
          ## Local validation passed
          Commit: {os.environ["GITHUB_SHA"]}
          Dependency lock SHA-256: {lock_hash}
          Python: 3.11.9 / Windows
          Source compilation, dependency consistency and isolated tests passed.
          CPU Docker image built: visual-analytics-api:{os.environ["GITHUB_SHA"]}
          Deployment selection: {os.environ["DEPLOYMENT_MODE"]}
          Selected deployments require matching readiness and a real prediction probe.
          This run does not train, transfer the dataset, or promote a model.
          """
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          '@ | & "$env:RUNNER_TEMP\venv\Scripts\python.exe" -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
